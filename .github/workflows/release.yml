name: Build Release Bundles

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            container: ubuntu:20.04 # this and forward should work then.
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies for rust install (Linux container only)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          # why does ubuntu want to configure tzdata in the middle of a build, idk but its annoying as hell:
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y curl build-essential pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Speed up repeated builds via rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxss-dev \
            libxtst-dev \
            libharfbuzz-dev \
            libfreetype6-dev \

      - name: Install dependencies (mac)
        if: runner.os == 'macOS'
        run: |
          brew install cmake

      - name: Install dependencies (Microslop)
        if: runner.os == 'Windows'
        run: |
          choco install cmake -y

      - name: Build (mac and Microslop)
        if: runner.os != 'Linux'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --release --locked

      - name: Build (Linux with rpath)
        if: runner.os == 'Linux'
        run: cargo build --release --locked
        env:
          # since we ship .so next to the binary, tell the linker to tell it to resolve those at runtime
          # and to look within ORIGIN (the directory of the executable)
          RUSTFLAGS: "-C link-args=-Wl,-rpath,$ORIGIN"        

      - name: Prepare dist (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/mikumikutactics dist/
          cp target/release/libSDL3* dist/

          # game assets
          cp -r assets dist/
          cp -r data dist/ || true
          cp -r levels dist/ || true
          cp -r shaders dist/ || true

      - name: Prepare dist (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/release/mikumikutactics dist/
          cp target/release/libSDL3*.dylib dist/ || true

          cp -r assets dist/
          cp -r data dist/ || true
          cp -r levels dist/ || true
          cp -r shaders dist/ || true

          install_name_tool -add_rpath @loader_path dist/mikumikutactics || true

      - name: Prepare dist (Microslop)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\release\mikumikutactics.exe dist\
          copy target\release\libSDL3* dist\
          copy target\release\SDL3.dll dist\
          copy target\release\SDL3_image.dll dist\

          if (Test-Path assets) {
            xcopy assets dist\assets /E /I /Y
          }

          if (Test-Path data) {
            xcopy data dist\data /E /I /Y
          }

          if (Test-Path levels) {
            xcopy levels dist\levels /E /I /Y
          }

          if (Test-Path shaders) {
            xcopy shaders dist\shaders /E /I /Y
          }          

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf mikumikutactics-linux.tar.gz -C dist .

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: tar -czf mikumikutactics-macos.tar.gz -C dist .

      - name: Archive (Microslop)
        if: runner.os == 'Windows'
        run: powershell Compress-Archive dist mikumikutactics-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikumikutactics-${{ runner.os }}
          path: |
            *.tar.gz
            *.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mikumikutactics-linux.tar.gz
            mikumikutactics-macos.tar.gz
            mikumikutactics-windows.zip